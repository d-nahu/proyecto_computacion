<body>
<div class="fondo"> </div>

<div class="contenedor-interno">

<!-- Pregunta 1 :D -->
<h1 class="txt">Para qué sirve un leer?</h1>

<div class="contenedor">
  
  <button class="boton rtcorrectas" onclick="Reemplazo('Excelente','boton'); new Audio('genio-v2.mp3').play();">Sirve para ingresar datos a una variable</button>
  

  <button class="boton rtincorrectas" onclick="Reemplazo('decepción','boton'); new Audio('SON2.mp3').play();">Sirve para mostrar un mensaje determinado en pantalla</button>
  
  <h9>ㅤ</h9>
</div>

<div id="boton" class="respuesta"></div>

<!-- Pregunta 2 D: -->

<h1 class="txt">Qué se necesita principalmente para hacer un contador?</h1>
<div class="contenedor">

  <button class="boton rtincorrectas" onclick="Reemplazo('Siempre haciendo todo mal, no es novedad','boton2'); new Audio('pedo.mp3').play();">No sé</button>
  

  <button class="boton rtcorrectas" onclick="Reemplazo('Ok','boton2'); new Audio('SON2.mp3').play();">Una estructura "Para" y adentro una variable que aumente cada vez que se usa el "Para"</button>

  <h9>ㅤ</h9>
</div>

<div id="boton2" class="respuesta"></div>

<!-- Pregunta 3 :I -->

<h1 class="txt">Cuál es la principal forma para hacer un menú?</h1>

<div class="contenedor">

  <button class="boton rtcorrectas" onclick="Reemplazo('Por fin haces algo bien','boton3'); new Audio('son.mp3').play();">Con un "Según"</button>

  <button class="boton rtincorrectas" onclick="Reemplazo('POR Q NO HACES ALGO BIEN','boton3'); new Audio('sad-meow-song.mp3').play();">Con un "Si-Entonces"</button>


  
  <h9>ㅤ</h9>
</div>

<div id="boton3" class="respuesta"></div>


<!-- Pregunta 4 :v -->

<h1 class="txt">Qué hace el "Escribir"??</h1>

<div class="contenedor">

<button class="boton rtcorrectas" onclick="Reemplazo('No me lo esperaba, está bien','boton4'); new Audio('sad-meow-song.mp3').play();">Muestra un mensaje determinado en pantalla</button>

  <button class="boton rtincorrectas" onclick="Reemplazo('Me lo esperaba, incorrecto','boton4'); new Audio('gato-riendo.mp3').play();">No escribe un mensaje en pantalla</button>

  
  <h9>ㅤ</h9>
</div>

<div id="boton4" class="respuesta"></div>

<!-- Pregunta 5 o: -->

<h1 class="txt">Se puede introducir el símbolo PI en Pseint?</h1>
<div class="contenedor">
  
  <button class="boton rtincorrectas" onclick="Reemplazo('nose, está bien','boton5'); new Audio('tienes-un-mensajeee.mp3').play();">NO</button>


  <button class="boton rtcorrectas" onclick="Reemplazo('Ya no sé que poner, está mal','boton5'); new Audio('SON2.mp3').play();">SÍ</button>
  
  <h9>ㅤ</h9>
</div>

<div id="boton5" class="respuesta"></div>
