<h1 class="txt">Qué es el Hardware?</h1>

<div class="contenedor">
  
  <button class="boton rtcorrectas" onclick="Reemplazo('GENIOO','boton'); new Audio('genio-v2.mp3').play();">Es la parte física de una computadora</button>

  <button class="boton rtincorrectas" onclick="Reemplazo('no podés equivocarte, son','boton'); new Audio('sad-meow-song.mp3').play();"> Es la parte intagible de una computadora</button>
  
  <h9>ㅤ</h9>
</div>

<!-- Pregunta 2 D: -->

<h1 class="txt">Qué es el Software?</h1>
<div class="contenedor">

  <button class="boton rtincorrectas" onclick="Reemplazo('Lo vimos mil veces','boton2'); new Audio('pedo.mp3').play();">Es la parte física donde se almacena toda la información</button>
  

  <button class="boton rtcorrectas" onclick="Reemplazo('Bueno está bien','boton2'); new Audio('son.mp3').play();">Es el conjunto de programas, datos e instrucciones que le indican a la computadora qué hacer</button>

<h1 class="txt">Cualés de estos son periféricos?</h1>

</div>
