<!-- Pregunta 1 :D -->
<h1 class="txt">Qué son las redes?</h1>

<div class="contenedor">
  
  <button class="boton rtcorrectas" onclick="Reemplazo('MUY BIEN SOS UN EXITOSO','boton'); new Audio('son.mp3').play();">Son las interconexiónes de un número determinado de computadoras a través de dispositivos alámbricos o inalámbricos</button>
  

  <button class="boton rtincorrectas" onclick="Reemplazo('Fracasado buscá un laburo asi haces algo en tu vida','boton'); new Audio('gato-riendo.mp3').play();">Las redes son estructuras invisibles formadas por nodos de energía magnética que conectan todos los dispositivos electrónicos mediante ondas estacionarias</button>
  
  <h9>ㅤ</h9>
</div>

<div id="boton" class="respuesta"></div>

<!-- Pregunta 2 D: -->

<h1 class="txt">Qué es la topología de red?</h1>
<div class="contenedor">

  <button class="boton rtincorrectas" onclick="Reemplazo('Estoy sumamente decepcionado','boton2'); new Audio('gato-riendo.mp3').play();">Es el conjunto de protocolos que determinan cómo se cifran los paquetes de datos para evitar colisiones de frecuencia </button>
  

  <button class="boton rtcorrectas" onclick="Reemplazo('Estoy orgulloso de vos','boton2'); new Audio('son.mp3').play();">Es la organización interna de los elementos que componen la red informática</button>

  <h9>ㅤ</h9>
</div>

<div id="boton2" class="respuesta"></div>

<!-- Pregunta 3 :I -->

<h1 class="txt">Qué tipos de redes existen?</h1>

<div class="contenedor">

  <button class="boton rtincorrectas" onclick="Reemplazo('bro, se equivocaba','boton3'); new Audio('gato-riendo.mp3').play();">RRT, RFL, ROGB</button>

  <button class="boton rtcorrectas" onclick="Reemplazo('Por fin haces algo bien','boton3'); new Audio('son.mp3').play();">LAN, MAN, WAN</button>
  
  <h9>ㅤ</h9>
</div>

<div id="boton3" class="respuesta"></div>


<!-- Pregunta 4 :v -->

<h1 class="txt">Qué función cumple la red en estrella?</h1>

<div class="contenedor">

  <button class="boton rtincorrectas" onclick="Reemplazo('Me lo esperaba, incorrecto','boton4'); new Audio('gato-riendo.mp3').play();">Hace que todos los dispositivos están conectados entre sí en un círculo continuo</button>


  <button class="boton rtcorrectas" onclick="Reemplazo('No me lo esperaba, está bien','boton4'); new Audio('son.mp3').play();">Lo que hace es que cada computadora tenga una conexión directa con el servidor, que se encuentra en el medio de todas</button>
  
  <h9>ㅤ</h9>
</div>

<div id="boton4" class="respuesta"></div>

<!-- Pregunta 5 o: -->

<h1 class="txt">Qué es una red LAN?</h1>
<div class="contenedor">
  
  <button class="boton rtincorrectas" onclick="Reemplazo('BIEN','boton5'); new Audio('gato-riendo.mp3').play();">Es una red informática cuyo alcance se limita a un espacio físico reducido, como una casa o un departamento</button>


  <button class="boton rtcorrectas" onclick="Reemplazo('Ya no sé que poner, está mal','boton5'); new Audio('son.mp3').play();">Es una red dinámica que decide qué paquetes de datos tienen prioridad para salir a internet cuando la banda ancha está saturada</button>
  
  <h9>ㅤ</h9>
</div>
